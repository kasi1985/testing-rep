name: Run AI Code Metrics on Pull Request
permissions:
  contents: read
  issues: write

on:
  pull_request_target:
    # Run in the base repository context when the branch is updated or PR is marked ready
    types: [synchronize, ready_for_review, reopened]

jobs:
  invoke-reusable:
    uses: ./.github/workflows/ai-metrics-reusable.yml
    with:
      runner: 'ubuntu-latest'
