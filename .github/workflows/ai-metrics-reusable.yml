name: AI Code Metrics Tracker

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label to use for the job (default: self-hosted)'
        required: false
        type: string
        default: 'self-hosted'

jobs:
  log-metrics:
    runs-on: ${{ inputs.runner }}
    outputs:
      AI_LINES: ${{ steps.calc.outputs.AI_LINES }}
      TOTAL_ADDED: ${{ steps.calc.outputs.TOTAL_ADDED }}
      HUMAN_LINES: ${{ steps.calc.outputs.HUMAN_LINES }}

    steps:
      - name: Checkout base branch (safe)
        uses: actions/checkout@v4
        with:
          # Checkout the base branch first to avoid executing untrusted code from the PR head
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Fetch and prepare PR head for diffing (no code execution)
        run: |
          # Fetch the PR head commit and make it available locally for diffing.
          # Do NOT run any scripts from the head; only inspect files.
          git fetch origin ${{ github.event.pull_request.head.sha }} --no-tags || true
          git checkout --detach ${{ github.event.pull_request.head.sha }} || git rev-parse --verify ${{ github.event.pull_request.head.sha }}

      - name: Calculate AI and Human Lines
        id: calc
        shell: bash
        run: |
          set -euo pipefail
          echo "======================================================================"
          echo " PROCESSING PULL REQUEST #${{ github.event.pull_request.number }}"
          echo "======================================================================"

          BASE_BRANCH="origin/${{ github.event.pull_request.base.ref }}"

          # Total lines added in PR (sum of additions across the combined diff)
          TOTAL_ADDED=$(git diff --numstat "$BASE_BRANCH"...HEAD | awk '{add+=$1} END {print add+0}')

          # Count AI-tagged lines by scanning the HEAD version of changed files for START/END tags
          TOTAL_AI=0
          # Use NUL-delimited filenames to be robust to spaces/newlines in filenames
          while IFS= read -r -d '' f; do
            [ -z "$f" ] && continue
            # ensure file exists at HEAD (skip deleted files)
            if git ls-tree -r --name-only HEAD | grep -qx "$f"; then
              ai_count=$(git show "HEAD":"$f" 2>/dev/null | awk '/START OF AI GENERATED/{in=1;next} /END OF AI GENERATED/{in=0} in{count++} END{print count+0}' || true)
              TOTAL_AI=$((TOTAL_AI + ${ai_count:-0}))
            fi
          done < <(git diff --name-only -z "$BASE_BRANCH"...HEAD)

          # Human-written lines = total added - AI detected lines
          TOTAL_HUMAN=$((TOTAL_ADDED - TOTAL_AI))
          if [ "$TOTAL_HUMAN" -lt 0 ]; then TOTAL_HUMAN=0; fi

          echo "AI_LINES=$TOTAL_AI" >> $GITHUB_OUTPUT
          echo "TOTAL_ADDED=$TOTAL_ADDED" >> $GITHUB_OUTPUT
          echo "HUMAN_LINES=$TOTAL_HUMAN" >> $GITHUB_OUTPUT

          echo "Developer Identity:    ${{ github.event.pull_request.user.login }}"
          echo "Total Lines Introduced: $TOTAL_ADDED"
          echo "------------------------------------------------------------------"
          echo " $TOTAL_AI LOC AI generated or AI assisted"
          echo " $TOTAL_HUMAN LOC written manually by developers"
          echo "======================================================================"


