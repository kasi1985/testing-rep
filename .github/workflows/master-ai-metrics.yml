name: Master AI Metrics on Push

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [master]

jobs:
  calc-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate AI and Human Lines for pushed range
        id: calc
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          echo "Processing push range: $BEFORE..$AFTER"

          # Determine changed files and total added lines
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # First push to branch: count all lines at AFTER
            TOTAL_ADDED=$(git ls-files | xargs -I{} git show "$AFTER:{}" 2>/dev/null | wc -l || echo 0)
            mapfile -t changed_files < <(git ls-files)
          else
            TOTAL_ADDED=$(git diff --numstat "$BEFORE..$AFTER" | awk '{add+=$1} END {print add+0}')
            mapfile -t changed_files < <(git diff --name-only "$BEFORE..$AFTER")
          fi

          TOTAL_AI=0

          for f in "${changed_files[@]}"; do
            [ -z "$f" ] && continue

            # Skip files that don't exist at AFTER (deleted files)
            if ! git ls-tree -r --name-only "$AFTER" | grep -qx "$f"; then
              continue
            fi

            # Count AI-tagged lines using START/END markers in the file at AFTER
            ai_count=$(git show "$AFTER:$f" 2>/dev/null \
              | awk '
                /AI-GENERATED-START/ { inside=1; next }
                /AI-GENERATED-END/   { inside=0; next }
                inside               { count++ }
                END                  { print count+0 }
              ')

            TOTAL_AI=$((TOTAL_AI + ai_count))
          done

          TOTAL_HUMAN=$((TOTAL_ADDED - TOTAL_AI))
          if [ "$TOTAL_HUMAN" -lt 0 ]; then TOTAL_HUMAN=0; fi

          echo "AI_LINES=$TOTAL_AI"       >> "$GITHUB_OUTPUT"
          echo "TOTAL_ADDED=$TOTAL_ADDED" >> "$GITHUB_OUTPUT"
          echo "HUMAN_LINES=$TOTAL_HUMAN" >> "$GITHUB_OUTPUT"

          echo "Computed: AI=$TOTAL_AI, Added=$TOTAL_ADDED, Human=$TOTAL_HUMAN"

      - name: Post or update AI Metrics issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner   = context.repo.owner;
            const repo    = context.repo.repo;
            const before  = context.payload.before;
            const after   = context.payload.after;

            const ai      = parseInt('${{ steps.calc.outputs.AI_LINES }}')    || 0;
            const added   = parseInt('${{ steps.calc.outputs.TOTAL_ADDED }}') || 0;
            const human   = parseInt('${{ steps.calc.outputs.HUMAN_LINES }}') || 0;
            const pct     = added > 0 ? ((ai / added) * 100).toFixed(1) : '0.0';

            const title = 'AI Metrics Summary (master)';
            const body  = [
              '## 🧾 AI Metrics — `master` branch',
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Push range | \`${before.slice(0,7)}\` → \`${after.slice(0,7)}\` |`,
              `| Total lines added | ${added} |`,
              `| AI-generated lines | ${ai} (${pct}%) |`,
              `| Human-written lines | ${human} |`,
              '',
              '_This issue is updated automatically by CI on every push to `master`._'
            ].join('\n');

            // Find existing open issue by title and update, or create new
            const issues   = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.data.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              console.log(`Updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              console.log(`Created issue #${created.data.number}`);
            }
