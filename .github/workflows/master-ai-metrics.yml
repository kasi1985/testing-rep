name: Master AI Metrics on Push

permissions:
  contents: read

on:
  push:
    branches: [master]

jobs:
  calc-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate AI and Human Lines for pushed range
        id: calc
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=${{ github.event.before }}
          AFTER=${{ github.sha }}

          echo "Processing push range: $BEFORE..$AFTER"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # first push: count all lines in repository at AFTER
            TOTAL_ADDED=$(git ls-files | xargs -I{} git show "$AFTER":"{}" 2>/dev/null | wc -l || echo 0)
            changed_files=$(git ls-files)
          else
            TOTAL_ADDED=$(git diff --numstat "$BEFORE".."$AFTER" | awk '{add+=$1} END {print add+0}')
            changed_files=$(git diff --name-only "$BEFORE".."$AFTER")
          fi

          TOTAL_AI=0
          for f in $changed_files; do
            [ -z "$f" ] && continue
            # make sure file exists at AFTER
            if git ls-tree -r --name-only "$AFTER" | grep -qx "$f"; then
              ai_count=$(git show "$AFTER":"$f" 2>/dev/null | awk '/START OF AI GENERATED/{in=1;next} /END OF AI GENERATED/{in=0} in{count++} END{print count+0}' || true)
              TOTAL_AI=$((TOTAL_AI + ${ai_count:-0}))
            fi
          done

          TOTAL_HUMAN=$((TOTAL_ADDED - TOTAL_AI))
          if [ "$TOTAL_HUMAN" -lt 0 ]; then TOTAL_HUMAN=0; fi

          echo "AI_LINES=$TOTAL_AI" >> $GITHUB_OUTPUT
          echo "TOTAL_ADDED=$TOTAL_ADDED" >> $GITHUB_OUTPUT
          echo "HUMAN_LINES=$TOTAL_HUMAN" >> $GITHUB_OUTPUT

          echo "Computed: AI=$TOTAL_AI, Added=$TOTAL_ADDED, Human=$TOTAL_HUMAN"

      - name: Display AI Metrics Summary
        env:
          AI_LINES: ${{ steps.calc.outputs.AI_LINES }}
          TOTAL_ADDED: ${{ steps.calc.outputs.TOTAL_ADDED }}
          HUMAN_LINES: ${{ steps.calc.outputs.HUMAN_LINES }}
        run: |
          echo "====================================================================="
          echo "AI METRICS SUMMARY (master push)"
          echo "====================================================================="
          echo "Push range: ${{ github.event.before }} → ${{ github.event.after }}"
          echo "Total lines introduced: $TOTAL_ADDED"
          echo "AI-tagged lines: $AI_LINES"
          echo "Human-written lines: $HUMAN_LINES"
          echo "====================================================================="
