name: Master AI Metrics on Push

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [master]

jobs:
  calc-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate AI and Human Lines for pushed range
        id: calc
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=${{ github.event.before }}
          AFTER=${{ github.sha }}

          echo "Processing push range: $BEFORE..$AFTER"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # first push: count all lines in repository at AFTER
            TOTAL_ADDED=$(git ls-files | xargs -I{} git show "$AFTER":"{}" 2>/dev/null | wc -l || echo 0)
            changed_files=$(git ls-files)
          else
            TOTAL_ADDED=$(git diff --numstat "$BEFORE".."$AFTER" | awk '{add+=$1} END {print add+0}')
            changed_files=$(git diff --name-only "$BEFORE".."$AFTER")
          fi

          TOTAL_AI=0
          for f in $changed_files; do
            [ -z "$f" ] && continue
            # make sure file exists at AFTER
            if git ls-tree -r --name-only "$AFTER" | grep -qx "$f"; then
              TOTAL_AI=$((TOTAL_AI + ai_count))
            fi
          done

          TOTAL_HUMAN=$((TOTAL_ADDED - TOTAL_AI))
          if [ "$TOTAL_HUMAN" -lt 0 ]; then TOTAL_HUMAN=0; fi

          echo "AI_LINES=$TOTAL_AI" >> $GITHUB_OUTPUT
          echo "TOTAL_ADDED=$TOTAL_ADDED" >> $GITHUB_OUTPUT
          echo "HUMAN_LINES=$TOTAL_HUMAN" >> $GITHUB_OUTPUT

          echo "Computed: AI=$TOTAL_AI, Added=$TOTAL_ADDED, Human=$TOTAL_HUMAN"

      - name: Post or update AI Metrics issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const before = context.payload.before;
            const after = context.payload.after;
            const ai = parseInt(process.env.AI_LINES || '${{ steps.calc.outputs.AI_LINES }}') || 0;
            const added = parseInt(process.env.TOTAL_ADDED || '${{ steps.calc.outputs.TOTAL_ADDED }}') || 0;
            const human = parseInt(process.env.HUMAN_LINES || '${{ steps.calc.outputs.HUMAN_LINES }}') || 0;

            const title = 'AI Metrics Summary (master)';
            const body = [
              '## 🧾 AI Metrics (master)',
              '',
              `Push range: ${before} → ${after}`,
              `Total lines introduced: ${added}`,
              `AI-tagged lines: ${ai}`,
              `Human-written lines: ${human}`,
              '',
              'This issue is updated automatically by the CI to summarize AI vs human contributions for pushes to `master`.'
            ].join('\n');

            // find existing issue by title
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: 'open' });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
